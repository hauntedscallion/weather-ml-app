name: Weather ML CI

on:
  push:
    branches:
      - main
      - bugfix
      - ci
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: PYTHONPATH=. python tests/smoke_test.py

      - name: Run unit tests
        run: PYTHONPATH=. python tests/unit_test.py

      - name: Run integration tests
        run: PYTHONPATH=. python tests/integration_test.py

  docker:
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t weather-ml-app .

      - name: Run Docker container
        run: docker run -d -p 5000:5000 --name weather-app weather-ml-app

      - name: Validate application starts
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then
              echo "Application started successfully"
              exit 0
            fi
            sleep 3
          done
          echo "Application failed to start"
          docker logs weather-app
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker stop weather-app || true

      - name: Log in to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag weather-ml-app hauntedscallion/weather-ml-app:${{ steps.ver.outputs.version }}
          docker tag weather-ml-app hauntedscallion/weather-ml-app:latest

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push hauntedscallion/weather-ml-app:${{ steps.ver.outputs.version }}
          docker push hauntedscallion/weather-ml-app:latest
